name: بناء التطبيق (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: بناء APK ورفعه في Releases
    runs-on: ubuntu-latest
    steps:
      - name: تحميل الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Flutter 3.35.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.3
          channel: stable
          cache: true

      - name: استكمال ملفات المشروع الناقصة
        run: flutter create . --project-name nathim --platforms android

      - name: استعادة الحزم
        run: flutter pub get

      - name: بناء نسخة الإصدار APK
        run: flutter build apk --release

      - name: رفع APK كملف مرفق بالبناء (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nathim-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: إنشاء Release مع رابط تحميل مباشر
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ناظِم — بناء رقم ${{ github.run_number }}
          body: |
            نسخة APK جاهزة للتثبيت على أندرويد.

            خطوات التثبيت:
            1. من قسم Assets بالأسفل حمّل الملف app-release.apk
            2. افتح الملف واسمح بالتثبيت من مصادر غير معروفة إذا سألك الهاتف
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
